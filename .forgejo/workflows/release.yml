name: IntelliFill OCR Release Coordinator

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the v prefix
        required: true
        default: "6.3.2"

jobs:
  validate-and-dispatch:
    name: Validate on Codeberg and start cross-platform packaging
    runs-on: codeberg-small-lazy
    container:
      image: mcr.microsoft.com/dotnet/sdk:8.0
    steps:
      - name: Checkout the Codeberg source
        shell: bash
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends ca-certificates curl git
          git clone --depth 1 --branch "$FORGEJO_REF_NAME" \
            https://codeberg.org/abijspy/intellifill-ocr.git source

      - name: Resolve release version
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ forgejo.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          else
            version="${FORGEJO_REF_NAME#v}"
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "Invalid release version: $version" >&2
            exit 1
          fi
          echo "RELEASE_VERSION=$version" >> "$FORGEJO_ENV"

      - name: Validate desktop and CLI projects
        shell: bash
        working-directory: source
        run: |
          dotnet restore src/IntelliFillOCR.Avalonia/IntelliFillOCR.Avalonia.csproj
          dotnet restore src/IntelliFillOCR.Cli/IntelliFillOCR.Cli.csproj
          dotnet build src/IntelliFillOCR.Avalonia/IntelliFillOCR.Avalonia.csproj \
            --configuration Release --no-restore
          dotnet build src/IntelliFillOCR.Cli/IntelliFillOCR.Cli.csproj \
            --configuration Release --no-restore

      - name: Dispatch cross-platform packaging to the GitHub runner mirror
        shell: bash
        env:
          RELEASE_DISPATCH_TOKEN: ${{ secrets.RELEASE_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${RELEASE_DISPATCH_TOKEN:-}" ]; then
            echo "RELEASE_DISPATCH_TOKEN is not configured in Codeberg Actions secrets." >&2
            exit 1
          fi
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $RELEASE_DISPATCH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/Abijspy/intellifill-ocr/dispatches \
            --data "{\"event_type\":\"codeberg-release\",\"client_payload\":{\"version\":\"$RELEASE_VERSION\"}}"
