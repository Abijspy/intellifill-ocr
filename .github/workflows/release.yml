name: IntelliFill OCR Builder

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the v prefix
        required: true
        default: "6.3.1"
  push:
    tags:
      - "v*"

permissions:
  actions: write
  contents: write

env:
  APP_NAME: IntelliFillOCR
  DOTNET_VERSION: "8.0.x"

jobs:
  windows-nsis:
    name: Build Windows ${{ matrix.runtime }} installer
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        runtime:
          - win-x64
          - win-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve release version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $version = "${{ inputs.version }}"
          } else {
            $version = "${{ github.ref_name }}".TrimStart("v")
          }
          if ($version -notmatch '^\d+\.\d+\.\d+(\.\d+)?$') {
            throw "Version must use semantic format like 3.4.0 or hotfix format like 3.4.0.1. Received: $version"
          }
          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y --no-progress

      - name: Stamp application version
        shell: pwsh
        run: .\scripts\set-release-version.ps1 -Version $env:RELEASE_VERSION

      - name: Build NSIS setup EXE
        shell: pwsh
        run: .\scripts\package-release.ps1 -Version $env:RELEASE_VERSION -RuntimeIdentifier "${{ matrix.runtime }}"

      - name: Collect Windows asset
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release-assets -Force | Out-Null
          $asset = "installer\out\IntelliFillOCR-$env:RELEASE_VERSION-setup-${{ matrix.runtime }}.exe"
          if (-not (Test-Path $asset)) {
            throw "Windows installer was not created: $asset"
          }
          Copy-Item $asset release-assets\

      - name: Upload Windows asset
        uses: actions/upload-artifact@v6
        with:
          name: windows-${{ matrix.runtime }}-nsis
          path: release-assets/*
          if-no-files-found: error

  linux-packages:
    name: Build Linux ${{ matrix.runtime }} packages
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runtime:
          - linux-x64
          - linux-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve release version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "Invalid version: $version" >&2
            exit 1
          fi
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install Linux package tooling
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm alien libarchive-tools zstd

      - name: Stamp application version
        shell: pwsh
        run: ./scripts/set-release-version.ps1 -Version $env:RELEASE_VERSION

      - name: Build Linux packages
        shell: bash
        run: |
          bash scripts/package-linux.sh "$RELEASE_VERSION" "${{ matrix.runtime }}" Release
          if [ "${{ matrix.runtime }}" = "linux-x64" ]; then
            bash scripts/prepare-solus-package.sh \
              "$RELEASE_VERSION" \
              "release/linux/IntelliFillOCR-$RELEASE_VERSION-linux-x64.tar.gz"
          fi

      - name: Collect Linux assets
        shell: bash
        run: |
          mkdir -p release-assets
          cp release/linux/*.tar.gz release-assets/
          cp release/linux/*.deb release-assets/
          cp release/linux/*.rpm release-assets/
          cp release/linux/*.pkg.tar.zst release-assets/
          if [ "${{ matrix.runtime }}" = "linux-x64" ]; then
            cp packaging/solus/package.yml \
              "release-assets/intellifill-ocr-$RELEASE_VERSION-solus-package.yml"
          fi

      - name: Upload Linux assets
        uses: actions/upload-artifact@v6
        with:
          name: linux-${{ matrix.runtime }}-packages
          path: release-assets/*
          if-no-files-found: error

  flatpak-bundles:
    name: Build Flatpak ${{ matrix.runtime }} bundle
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: linux-x64
            runner: ubuntu-latest
          - runtime: linux-arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve release version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "Invalid version: $version" >&2
            exit 1
          fi
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install Flatpak tooling and runtime
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub \
            https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive -y flathub \
            org.freedesktop.Platform//25.08 \
            org.freedesktop.Sdk//25.08

      - name: Stamp application version
        shell: pwsh
        run: ./scripts/set-release-version.ps1 -Version $env:RELEASE_VERSION

      - name: Build self-contained Flatpak bundle
        shell: bash
        run: bash scripts/package-flatpak.sh "$RELEASE_VERSION" "${{ matrix.runtime }}" Release

      - name: Upload Flatpak asset
        uses: actions/upload-artifact@v6
        with:
          name: flatpak-${{ matrix.runtime }}
          path: release/flatpak/IntelliFillOCR-${{ env.RELEASE_VERSION }}-${{ matrix.runtime }}.flatpak
          if-no-files-found: error

  macos-packages:
    name: Build macOS ${{ matrix.runtime }} disk image
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        runtime:
          - osx-arm64
          - osx-x64
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve release version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "Invalid version: $version" >&2
            exit 1
          fi
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Stamp application version
        shell: pwsh
        run: ./scripts/set-release-version.ps1 -Version $env:RELEASE_VERSION

      - name: Build application bundle and DMG
        shell: bash
        run: bash scripts/package-macos.sh "$RELEASE_VERSION" "${{ matrix.runtime }}" Release

      - name: Upload macOS asset
        uses: actions/upload-artifact@v6
        with:
          name: macos-${{ matrix.runtime }}
          path: release/macos/IntelliFillOCR-${{ env.RELEASE_VERSION }}-${{ matrix.runtime }}.dmg
          if-no-files-found: error

  publish-release:
    name: Publish packages release
    runs-on: ubuntu-latest
    needs:
      - windows-nsis
      - linux-packages
      - flatpak-bundles
      - macos-packages
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve release version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v$version" >> "$GITHUB_ENV"

      - name: Download assets
        uses: actions/download-artifact@v7
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate NixOS package
        shell: bash
        run: |
          bash scripts/prepare-nixos-package.sh \
            "$RELEASE_VERSION" \
            "release-assets/IntelliFillOCR-$RELEASE_VERSION-linux-x64.tar.gz" \
            "release-assets/IntelliFillOCR-$RELEASE_VERSION-linux-arm64.tar.gz" \
            "release-assets/intellifill-ocr-$RELEASE_VERSION.nix"

      - name: Write asset checksums
        shell: bash
        run: |
          (cd release-assets && sha256sum * > SHA256SUMS.txt)

      - name: Write release notes
        shell: bash
        run: |
          scripts/write-release-notes.sh "$RELEASE_VERSION" src/IntelliFillOCR.Avalonia/MainWindow.axaml.cs > release-notes.md
          test -s release-notes.md

      - name: Create or update GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          mapfile -t assets < <(find release-assets -maxdepth 1 -type f | sort)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No release assets downloaded." >&2
            exit 1
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            while IFS= read -r name; do
              [ -n "$name" ] && gh release delete-asset "$RELEASE_TAG" "$name" -y
            done < <(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
            gh release edit "$RELEASE_TAG" --notes-file release-notes.md --title "IntelliFill OCR $RELEASE_VERSION"
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" --title "IntelliFill OCR $RELEASE_VERSION" --notes-file release-notes.md --target "$GITHUB_SHA"
          fi

      - name: Publish signed Linux package repositories
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run publish-linux-repositories.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" -f version="$RELEASE_VERSION"
