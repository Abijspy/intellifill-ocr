name: Publish Codeberg Pages

on:
  workflow_dispatch:
    inputs:
      version:
        description: Optional release version for latest-only Linux repositories
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/publish-codeberg-pages.yml"

permissions:
  contents: read

concurrency:
  group: publish-codeberg-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Prepare Codeberg Pages checkout
        env:
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CODEBERG_TOKEN"
          repo_url="https://abijspy:${CODEBERG_TOKEN}@codeberg.org/abijspy/intellifill-ocr.git"
          if git ls-remote --exit-code --heads "$repo_url" pages >/dev/null 2>&1; then
            git clone --depth 1 --single-branch --branch pages "$repo_url" codeberg-pages
          else
            mkdir codeberg-pages
            git -C codeberg-pages init
          fi
          rsync -a --delete \
            --exclude '.git/' \
            --exclude 'apt/' \
            --exclude 'rpm/' \
            --exclude 'arch/' \
            --exclude 'keys/' \
            website/ codeberg-pages/

      - name: Build latest-only signed package repositories
        if: ${{ inputs.version != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_SIGNING_KEY: ${{ secrets.INTELLIFILL_PACKAGE_SIGNING_KEY }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y apt-utils createrepo-c gnupg
          mkdir release-assets
          gh release download "v$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" \
            --dir release-assets --pattern '*.deb' --pattern '*.rpm' \
            --pattern '*.pkg.tar.zst' --clobber
          printf '%s' "$PACKAGE_SIGNING_KEY" | gpg --batch --import

          rm -rf codeberg-pages/apt codeberg-pages/rpm codeberg-pages/arch codeberg-pages/keys
          mkdir -p codeberg-pages/apt/pool/main/i/intellifill-ocr \
            codeberg-pages/apt/dists/stable/main/binary-amd64 \
            codeberg-pages/apt/dists/stable/main/binary-arm64 \
            codeberg-pages/rpm/x86_64 codeberg-pages/rpm/aarch64 \
            codeberg-pages/arch/x86_64 codeberg-pages/arch/aarch64 \
            codeberg-pages/keys
          cp release-assets/*.deb codeberg-pages/apt/pool/main/i/intellifill-ocr/
          cp package-repository/keys/intellifill-ocr-archive-keyring.gpg codeberg-pages/keys/

          for package in release-assets/*.rpm; do
            architecture="$(rpm -qp --qf '%{ARCH}' "$package")"
            if [[ "$architecture" == aarch64 || "$architecture" == arm64 ]]; then destination=aarch64; else destination=x86_64; fi
            cp "$package" "codeberg-pages/rpm/$destination/"
          done
          for package in release-assets/*.pkg.tar.zst; do
            if [[ "$package" == *-aarch64.pkg.tar.zst ]]; then destination=aarch64; else destination=x86_64; fi
            cp "$package" "codeberg-pages/arch/$destination/"
          done

          (
            cd codeberg-pages/apt
            for architecture in amd64 arm64; do
              apt-ftparchive -a "$architecture" packages pool > "dists/stable/main/binary-$architecture/Packages"
              gzip --no-name --force --keep "dists/stable/main/binary-$architecture/Packages"
            done
            apt-ftparchive \
              -o APT::FTPArchive::Release::Origin='IntelliFill OCR' \
              -o APT::FTPArchive::Release::Label='IntelliFill OCR' \
              -o APT::FTPArchive::Release::Suite=stable \
              -o APT::FTPArchive::Release::Codename=stable \
              -o APT::FTPArchive::Release::Architectures='amd64 arm64' \
              -o APT::FTPArchive::Release::Components=main \
              release dists/stable > dists/stable/Release
            gpg --batch --yes --armor --detach-sign --output dists/stable/Release.gpg dists/stable/Release
            gpg --batch --yes --clearsign --output dists/stable/InRelease dists/stable/Release
          )

          for architecture in x86_64 aarch64; do
            createrepo_c "codeberg-pages/rpm/$architecture"
            gpg --batch --yes --armor --detach-sign \
              --output "codeberg-pages/rpm/$architecture/repodata/repomd.xml.asc" \
              "codeberg-pages/rpm/$architecture/repodata/repomd.xml"
            for package in codeberg-pages/arch/$architecture/*.pkg.tar.zst; do
              gpg --batch --yes --detach-sign --output "$package.sig" "$package"
            done
            docker run --rm -v "$PWD/codeberg-pages/arch/$architecture:/repo" \
              archlinux:base-devel bash -lc \
              'cd /repo && repo-add intellifill-ocr.db.tar.gz ./*.pkg.tar.zst'
          done

      - name: Publish fresh Codeberg Pages snapshot
        env:
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          cd codeberg-pages
          rm -rf .git
          git init
          git checkout -b pages
          git add --all
          git -c user.name='IntelliFill OCR Publisher' \
              -c user.email='abijspy@noreply.codeberg.org' \
              commit -m "Publish Codeberg Pages${RELEASE_VERSION:+ v$RELEASE_VERSION}"
          git remote add origin \
            "https://abijspy:${CODEBERG_TOKEN}@codeberg.org/abijspy/intellifill-ocr.git"
          git push --force origin pages
