name: Publish Linux package repositories

on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing GitHub Release version, without the v prefix
        required: true
        default: "6.0.0"

concurrency:
  group: publish-linux-repositories
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install repository tools
        run: |
          sudo apt-get update
          sudo apt-get install -y apt-utils createrepo-c gnupg

      - name: Download release packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release-assets

          gh release download "v${{ inputs.version }}" \
            --repo "$GITHUB_REPOSITORY" \
            --dir release-assets \
            --pattern "*.deb" \
            --pattern "*.rpm" \
            --pattern "*.pkg.tar.zst" \
            --clobber

      - name: Import package signing key
        env:
          PACKAGE_SIGNING_KEY: ${{ secrets.INTELLIFILL_PACKAGE_SIGNING_KEY }}
        run: |
          printf '%s' "$PACKAGE_SIGNING_KEY" | gpg --batch --import

      - name: Build signed repositories
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git ls-remote --exit-code --heads \
              "https://github.com/${GITHUB_REPOSITORY}.git" \
              gh-pages >/dev/null 2>&1; then

            git clone \
              --depth 1 \
              --branch gh-pages \
              "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
              published-repository

          else
            mkdir -p published-repository

            cd published-repository
            git init
            git checkout -b gh-pages
            git remote add origin \
              "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            cd ..
          fi

          mkdir -p \
            published-repository/apt/pool/main/i/intellifill-ocr \
            published-repository/apt/dists/stable/main/binary-amd64 \
            published-repository/apt/dists/stable/main/binary-arm64 \
            published-repository/rpm/x86_64 \
            published-repository/rpm/aarch64 \
            published-repository/arch/x86_64 \
            published-repository/arch/aarch64 \
            published-repository/keys

          # Repository metadata is rebuilt from the retained package files.
          rm -rf published-repository/rpm/x86_64/repodata published-repository/rpm/aarch64/repodata

          cp release-assets/*.deb \
            published-repository/apt/pool/main/i/intellifill-ocr/

          for package in release-assets/*.rpm; do
            package_architecture="$(rpm -qp --qf '%{ARCH}' "$package")"
            if [[ "$package_architecture" == aarch64 || "$package_architecture" == arm64 ]]; then destination=aarch64; else destination=x86_64; fi
            cp "$package" "published-repository/rpm/$destination/"
          done
          for package in release-assets/*.pkg.tar.zst; do
            if [[ "$package" == *-aarch64.pkg.tar.zst ]]; then destination=aarch64; else destination=x86_64; fi
            cp "$package" "published-repository/arch/$destination/"
          done

          keep_three() {
            local directory="$1" pattern="$2"
            mapfile -t packages < <(find "$directory" -maxdepth 1 -type f -name "$pattern" | sort -V)
            if [ "${#packages[@]}" -gt 3 ]; then
              for package in "${packages[@]:0:${#packages[@]}-3}"; do rm -f -- "$package" "$package.sig"; done
            fi
          }
          keep_three published-repository/apt/pool/main/i/intellifill-ocr '*_amd64.deb'
          keep_three published-repository/apt/pool/main/i/intellifill-ocr '*_arm64.deb'
          for architecture in x86_64 aarch64; do
            keep_three "published-repository/rpm/$architecture" '*.rpm'
            keep_three "published-repository/arch/$architecture" '*.pkg.tar.zst'
          done

          cp package-repository/keys/intellifill-ocr-archive-keyring.gpg \
            published-repository/keys/

          for architecture in amd64 arm64; do
            count=$(find published-repository/apt/pool/main/i/intellifill-ocr -maxdepth 1 -type f -name "*_${architecture}.deb" | wc -l)
            test "$count" -ge 1 && test "$count" -le 3
          done

          (
            cd published-repository/apt

            for architecture in amd64 arm64; do
              apt-ftparchive -a "$architecture" packages pool > "dists/stable/main/binary-$architecture/Packages"
              gzip --no-name --force --keep "dists/stable/main/binary-$architecture/Packages"
            done

            apt-ftparchive \
              -o APT::FTPArchive::Release::Origin="IntelliFill OCR" \
              -o APT::FTPArchive::Release::Label="IntelliFill OCR" \
              -o APT::FTPArchive::Release::Suite=stable \
              -o APT::FTPArchive::Release::Codename=stable \
              -o APT::FTPArchive::Release::Architectures="amd64 arm64" \
              -o APT::FTPArchive::Release::Components=main \
              release \
              dists/stable \
              > dists/stable/Release

            gpg \
              --batch \
              --yes \
              --armor \
              --detach-sign \
              --output dists/stable/Release.gpg \
              dists/stable/Release

            gpg \
              --batch \
              --yes \
              --clearsign \
              --output dists/stable/InRelease \
              dists/stable/Release
          )

          for architecture in x86_64 aarch64; do
            createrepo_c "published-repository/rpm/$architecture"
            gpg --batch --yes --armor --detach-sign \
              --output "published-repository/rpm/$architecture/repodata/repomd.xml.asc" \
              "published-repository/rpm/$architecture/repodata/repomd.xml"
            for package in published-repository/arch/$architecture/*.pkg.tar.zst; do
              gpg --batch --yes --detach-sign --output "$package.sig" "$package"
            done
            docker run --rm \
              -v "$PWD/published-repository/arch/$architecture:/repo" \
              archlinux:base-devel \
              bash -lc 'cd /repo && repo-add intellifill-ocr.db.tar.gz ./*.pkg.tar.zst'
          done

          printf '%s\n' \
            '[intellifill-ocr]' \
            'name=IntelliFill OCR' \
            'baseurl=https://packages.abishekprabakaran.com/rpm/$basearch' \
            'enabled=1' \
            'gpgcheck=0' \
            'repo_gpgcheck=1' \
            'gpgkey=https://packages.abishekprabakaran.com/keys/intellifill-ocr-archive-keyring.gpg' \
            > published-repository/intellifill-ocr.repo

      - name: Publish GitHub Pages branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd published-repository

          echo "=== Largest repository files ==="
          find . \
            -path './.git' -prune -o \
            -type f -printf '%s %p\n' | \
            sort -nr | \
            sed -n '1,30p' | \
            numfmt --field=1 --to=iec-i --suffix=B

          echo "=== Checking GitHub 100 MiB file limit ==="
          oversized="$(
            find . \
              -path './.git' -prune -o \
              -type f -size +104857600c -print
          )"
          if [ -n "$oversized" ]; then
            echo "::error::Files larger than GitHub's 100 MiB Git limit:"
            printf '%s\n' "$oversized"
            exit 1
          fi

          git add --all

          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit \
              -m "Publish Linux packages v${{ inputs.version }}" || true

          echo "=== Git status and object database ==="
          git status --short
          git count-objects -vH

          git branch -M gh-pages

          git remote set-url origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          echo "=== Pushing gh-pages ==="
          git \
            -c pack.window=0 \
            -c pack.compression=0 \
            push \
            --progress \
            origin gh-pages
